[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "evidence-coding-agent"
version = "0.1.0"
description = "A small evidence-driven coding agent without an agent framework"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
include = ["coding_agent*"]
